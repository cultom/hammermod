name: Release
# Push a version tag (e.g. 0.2.0): the tests run and a GitHub release with a zip is made.
# ContentDB picks the tag up through its automatic releases ("New Tag", checked nightly).
# For an immediate ContentDB release, an admin stores the package author's token once:
#   avanti secrets setup && avanti secrets push cultom/hammermod
# (ContentDB rejects co-maintainer tokens, contentdb#612); without it that step is skipped.
on:
  push:
    tags: ["v*", "[0-9]*"]

permissions:
  contents: write

jobs:
  ci:
    uses: culmat/avanti-luanti/.github/workflows/mod-ci.yml@v2
  release:
    needs: ci
    uses: culmat/avanti-luanti/.github/workflows/mod-release.yml@v2
    secrets: inherit
